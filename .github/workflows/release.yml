name: Release Workflow

on:
  push:
    tags:
      - "release-request/v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: diggsweden/forge-ci/.github/workflows/release-orchestrator.yml@v0.91.13
    permissions:
      contents: write
      packages: write
      id-token: write
      actions: read
      security-events: write
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # GPG signs the release commit and the tag.
      RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
      RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
      RELEASE_GPG_PUBLIC_KEY: ${{ secrets.RELEASE_GPG_PUBLIC_KEY }}
      CODE_SCANNING_TOKEN: ${{ secrets.CODE_SCANNING_TOKEN }}
    with:
      branch: main
      forge-ci-binary-ref: v0.91.13
      artifacts-config: .forge-ci/artifacts.yml
      changelog-creator: git-cliff
      release-publisher: github-cli
