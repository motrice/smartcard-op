# nanolinter verify plan. forge-ci's lint gate runs `nanolinter verify` against
# it.
#
# Strict profile: every check in [verify].checks also appears in
# [policy].block, so any finding fails the build.
#
# `links` is deliberately left out: the README and the plan point at a dozen
# external EFOS and vendor pages, and a link check per pull request would fail
# the build whenever someone else's website is under maintenance.
#
# `security-scorecard` requires a published repository and is switched on once
# the project is public.
#
# Inspect the plan: `nanolinter dry-run-plan`. Tool health: `nanolinter doctor`.

[detect]
auto = true

[verify]
checks = [
  "version-control",
  "commits",
  "secrets",
  "osv",
  "sast",
  "typos",
  "toml",
  "yaml",
  "markdown",
  "license",
  "container",
  "actions",
  "trivy-fs",
  "go-vulncheck",
  "go-golangci",
  "go-format",
  "shell",
  "shell-format",
]

[policy]
block = [
  "version-control",
  "commits",
  "secrets",
  "osv",
  "sast",
  "typos",
  "toml",
  "yaml",
  "markdown",
  "license",
  "container",
  "actions",
  "trivy-fs",
  "go-vulncheck",
  "go-golangci",
  "go-format",
  "shell",
  "shell-format",
]
