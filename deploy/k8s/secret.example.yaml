# Shape only. Do not commit real values: sync them in from the agency's secret
# manager with External Secrets or Sealed Secrets.
#
#   client-secret      what Zitadel is configured with; at least 43 characters
#   token-crypto-key   32 bytes, base64 -- encrypts the opaque access tokens
#   audit-hmac-key     keys the audit log's identity-number redaction. It must
#                      never rotate: a new key orphans every historical record
#                      from the person it concerns, which is the one thing the
#                      field exists to support.
apiVersion: v1
kind: Secret
metadata:
  name: smartcard-op
  labels:
    app.kubernetes.io/name: smartcard-op
type: Opaque
stringData:
  client-id: zitadel
  client-secret: REPLACE_ME
  token-crypto-key: REPLACE_ME_BASE64_32_BYTES
  audit-hmac-key: REPLACE_ME
---
# The signing keys, generated outside the cluster:
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
#     -out current.pem
#
# current.pem is required. next.pem is published without being used, so that a
# new key is known to every verifier before it first signs; retired.pem is
# published so that tokens still in flight after a rotation can be verified.
# A key file that is present but malformed stops the service, rather than
# silently publishing fewer keys than intended.
apiVersion: v1
kind: Secret
metadata:
  name: smartcard-op-keys
  labels:
    app.kubernetes.io/name: smartcard-op
type: Opaque
stringData:
  current.pem: REPLACE_ME_PKCS8_PEM
