# Pinned toolchain. The same versions locally and in CI, so `just verify` means
# the same thing in both places.
#
# Only the tools we invoke ourselves are pinned here, and now we invoke them
# all: forge-ci's lint gate is switched off (lint-engine: none), because the
# nanolinter image it runs from is not publicly pullable -- an anonymous pull of
# ghcr.io/itiquette/nanolinter answers denied for every tag, and a consumer's
# GITHUB_TOKEN does not reach it either. So the checks nanolinter would have
# delegated are run directly instead.
#
# Install everything: mise install

[settings]
experimental = true

# Supply-chain quarantine: refuse to install a release published within the
# last seven days, so that a freshly poisoned release has time to be noticed
# before it lands here. The convention is taken from forge-ci.
minimum_release_age = "7d"

[tools]
# The compiler patch version is pinned: released binaries carry its standard
# library.
go = "1.27.3"
"aqua:casey/just" = "1.58.0"

# Invoked directly by `just lint` and `just vuln`. golangci-lint also runs in
# the gate, through nanolinter's go-golangci check, so the version is kept
# aligned with forge-ci's pin to avoid a finding that appears only in one place.
"aqua:golangci/golangci-lint" = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# The checks nanolinter would have run for us, now run directly by `just`.
"aqua:zricethezav/gitleaks" = "v8.30.1"            # just secrets
# reuse is a Python tool, installed through uv. uv has to be pinned too, or the
# pipx.uvx setting above has nothing to run and the install fails with an
# unhelpful pipx argument error.
"aqua:astral-sh/uv" = "0.9.9"
"pipx:reuse" = "6.2.0"                             # just reuse
# gommitlint is hosted on codefloe, so the api_url is required: without it mise
# looks on codeberg and answers 404.
"forgejo:itiquette/gommitlint" = { version = "0.93.0", api_url = "https://codefloe.com/api/v1" }
